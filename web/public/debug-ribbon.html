<!doctype html>
<html lang="ru">
<head>

<title>debug-ribbon — минимальное воспроизведение лент</title>
<style>
  body { margin: 0; background: #060a12; color: #9dacc6; font: 12px/1.6 monospace; }
  #panel { position: fixed; top: 12px; left: 12px; z-index: 10; padding: 10px 14px;
           background: rgba(10,14,22,.9); border: 1px solid rgba(56,189,248,.3);
           white-space: pre-wrap; max-width: 70vw; }
  #panel b { color: #38bdf8; }
  #panel .bad { color: #ff7a8a; }
  #panel .good { color: #5fe8c8; }
</style>
<script>
  (function () {
    const orig = console.error.bind(console);
    const origW = console.warn.bind(console);
    const buf = [];
    const flush = () => {
      const p = document.getElementById("panel");
      if (p && buf.length) p.innerHTML = '<span class="bad">' + buf.join("<br>") + "</span><br>" + p.innerHTML;
    };
    console.error = (...a) => { buf.push("C-ERR: " + a.map((x) => String(x).slice(0, 300)).join(" ")); orig(...a); flush(); };
    console.warn = (...a) => { buf.push("C-WARN: " + a.map((x) => String(x).slice(0, 200)).join(" ")); origW(...a); flush(); };
  })();
</script>
<script>
  window.addEventListener("error", function (e) {
    var p = document.getElementById("panel");
    if (p) p.innerHTML = '<span class="bad">ERROR: ' + ((e.error && e.error.stack) || e.message) + '</span>';
  });
  window.addEventListener("unhandledrejection", function (e) {
    var p = document.getElementById("panel");
    if (p) p.innerHTML = '<span class="bad">REJECTION: ' + ((e.reason && e.reason.stack) || e.reason) + '</span>';
  });
</script>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="panel">init…</div>
<script type="module">
import * as THREE from "three";

const SUN_VERTEX = `
// NB: instanceMatrix/instanceColor объявляет сам three (USE_INSTANCING
// prefix для InstancedMesh) — свои объявления ломают компиляцию
attribute float aInstSeed;

uniform float uTime; // пульс масштаба («солнце дышит»)

varying vec3 vObjPos;
varying vec3 vNormal;
varying vec3 vLayerColor;
varying float vSeed;
varying float vAlpha;

void main() {
  // ПРИГОВОР: vAlpha инвертирована — полная вблизи (подлёт в 50 юнитов),
  // плавное растворение к 250, где Points уже берут своё
  vec4 local = vec4(position * (1.0 + 0.04 * sin(uTime * 1.3 + aInstSeed * 6.2831)), 1.0);
  vec4 world = instanceMatrix * local;
  vec4 mv = modelViewMatrix * world;
  float dist = length(mv.xyz);
  vAlpha = 1.0 - smoothstep(130.0, 250.0, dist);
  vObjPos = position;
  vNormal = normalize(mat3(instanceMatrix) * normal);
  vLayerColor = instanceColor;
  vSeed = aInstSeed;
  gl_Position = projectionMatrix * mv;
}
`;
const SUN_FRAGMENT = `
precision highp float;

uniform float uTime;

varying vec3 vObjPos;
varying vec3 vNormal;
varying vec3 vLayerColor;
varying float vSeed;
varying float vAlpha;

float hash13(vec3 p) {
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}

float vnoise(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash13(i), hash13(i + vec3(1.0, 0.0, 0.0)), u.x),
        mix(hash13(i + vec3(0.0, 1.0, 0.0)), hash13(i + vec3(1.0, 1.0, 0.0)), u.x), u.y),
    mix(mix(hash13(i + vec3(0.0, 0.0, 1.0)), hash13(i + vec3(1.0, 0.0, 1.0)), u.x),
        mix(hash13(i + vec3(0.0, 1.0, 1.0)), hash13(i + vec3(1.0, 1.0, 1.0)), u.x), u.y),
    u.z);
}

float fbm(vec3 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++) {
    v += a * vnoise(p);
    p = p * 2.1 + vec3(11.7);
    a *= 0.5;
  }
  return v;
}

// медленное вращение поверхности вокруг Y (по uTime + seed)
vec3 spin(vec3 p, float ang) {
  float c = cos(ang);
  float s = sin(ang);
  return vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z);
}

void main() {
  // вращающаяся турбулентная поверхность (плазма)
  vec3 sp = spin(vObjPos * 2.2, uTime * 0.12 + vSeed * 6.2831);
  float n = fbm(sp + vec3(uTime * 0.04));
  float n2 = fbm(sp * 3.1 - vec3(uTime * 0.06));

  vec3 dark = vLayerColor * 0.22;
  vec3 mid = vLayerColor;
  vec3 bright = mix(vLayerColor, vec3(1.0), 0.62);

  vec3 surface = mix(dark, mid, smoothstep(0.28, 0.55, n));
  surface = mix(surface, bright, smoothstep(0.55, 0.85, n));
  // яркие прожилки плазмы
  surface += bright * pow(max(0.0, n2 - 0.45), 2.0) * 2.4;

  vec3 N = normalize(vNormal);
  vec3 V = vec3(0.0, 0.0, 1.0); // к камере в view-space
  float facing = max(dot(N, V), 0.0);
  // лимб-свечение: край солнца ярче центра (как на эталоне)
  float limb = pow(1.0 - facing, 2.0);
  surface += bright * limb * 0.85;
  // лёгкая тень центра для объёма
  surface *= 0.55 + 0.45 * facing;

  gl_FragColor = vec4(surface, vAlpha);
}
`;
const CORONA_VERTEX = `
// instanceMatrix/instanceColor префиксует three.js для InstancedMesh — НЕ объявлять (redefinition)
attribute float aInstSeed;

uniform float uTime;

varying vec3 vLayerColor;
varying float vSeed;
varying vec2 vQuad;

void main() {
  // масштаб инстанса (радиус сферы в юнитах) — из первой колонки матрицы
  float instScale = length(vec3(instanceMatrix[0][0], instanceMatrix[0][1], instanceMatrix[0][2]));
  vec4 mvCenter = modelViewMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
  // billboard: квад в view-space вокруг центра, радиус короны = 2× сферы
  // (в ЮНИТАХ — перспективно корректно: корона растёт с солнцем)
  mvCenter.xy += position.xy * instScale * 2.0;
  vLayerColor = instanceColor;
  vSeed = aInstSeed;
  vQuad = position.xy;
  gl_Position = projectionMatrix * mvCenter;
}
`;
const CORONA_FRAGMENT = `
precision highp float;

uniform float uTime;

varying vec3 vLayerColor;
varying float vSeed;
varying vec2 vQuad;

void main() {
  float r = length(vQuad);          // 0..~1.41
  float ang = atan(vQuad.y, vQuad.x);

  // радиальный градиент: плотно у сферы, спад к краю
  float body = smoothstep(1.15, 0.42, r);
  // «огонь дышит»: мерцание 0.3-0.6 Гц + шифт оттенка по периметру
  float flicker = 0.78 + 0.22 * sin(uTime * 2.8 + vSeed * 6.2831 + ang * 2.0);
  float hueShift = 0.5 + 0.5 * sin(uTime * 0.9 + ang * 3.0 + vSeed * 4.0);
  vec3 tint = mix(vLayerColor, vec3(1.0), 0.25 + 0.2 * hueShift);

  float alpha = body * flicker * 0.55;
  gl_FragColor = vec4(tint * alpha, alpha);
}
`;

const panel = document.getElementById("panel");
const lines = [];
const say = (text, cls = "") => { lines.push(cls ? `<span class="${cls}">${text}</span>` : text); };

try { // ==== весь модуль под стек-ловушкой ====

// ── рендерер/камера как в основной сцене ──
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
} catch (e) {
  say(`WebGLRenderer FAILED: ${e.message}`, "bad");
  panel.innerHTML = lines.join("\n");
  throw e;
}
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.debug.checkShaderErrors = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 2, 20000);
camera.position.set(0, 620, 950);
camera.lookAt(0, 0, 0);

// ── копия вершинного/фрагментного шейдера лент (1:1 из shaders.ts) ──
const EDGE_VERTEX = `
attribute vec3 aOther;
attribute vec3 aColor;
attribute float aWeight;
attribute float aKind;
attribute float aEnd;
attribute float aSide;
attribute float aHighlight;

uniform vec2 uViewport;   // px
uniform float uEdgeWidth; // полная толщина в px

varying vec3 vColor;
varying float vAlpha;
varying float vKind;
varying float vEnd;
varying float vPhase;

const float FADE_START = 1100.0;
// узлы выбираются до 2200 — лента с видимым концом доживает до дальнего
const float FADE_END = 2400.0;

void main() {
  vec4 clipA = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  vec4 clipB = projectionMatrix * modelViewMatrix * vec4(aOther, 1.0);
  if (clipA.w <= 0.0 || clipB.w <= 0.0) {
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    vAlpha = 0.0;
    return;
  }
  vec4 clipSelf = mix(clipA, clipB, aEnd);
  // ВНУТРЕННИЙ БИСЕКТ: тривиальное вертикальное смещение ±1% экрана.
  // NB: вариант с * clipSelf.w (как в ТЗ) даёт ndc = 0.02×w ≈ 20 при w=1000 —
  // ленты за экраном, тест невалиден. Поэтому смещение в ndc БЕЗ ×w.
  gl_Position = vec4(clipSelf.xy + vec2(0.0, aSide * 0.02), clipSelf.zw);
  vColor = aColor;
  vAlpha = 1.0;
  vKind = aKind;
  vEnd = aEnd;
  vPhase = 0.0;
}
`;

const EDGE_FRAGMENT_SOLID = `
precision highp float;

uniform float uTime;
uniform float uDebugSolid; // ?debug=1: белые непрозрачные ленты — проверка канала

varying vec3 vColor;
varying float vAlpha;
varying float vKind;
varying float vEnd;
varying float vPhase;

void main() {
  // КРАСНЫЙ БИСЕКТ: безусловно непрозрачный красный — решаем, растеризуются
  // ли ленты вообще. Убрать после вердикта Мастера!
  gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
  return;
  // ШАГ 1 диагностики: доказать глазами, что геометрия/канал верны
  if (uDebugSolid > 0.5) {
    gl_FragColor = vec4(1.0, 1.0, 1.0, 1.0);
    return;
  }

  float alpha = vAlpha;

  // dashed jump routes for supersedes: six dim gaps along the gate
  if (vKind > 0.5 && vKind < 1.5) {
    float phase = fract(vEnd * 6.0);
    alpha *= mix(0.15, 1.0, step(phase, 0.55));
  }

  // contradicts СИЯЮТ (фидбек 6): редкий тип, time-based glow wave по ребру
  if (vKind > 1.5) {
    alpha *= 0.55 + 0.45 * sin(uTime * 2.6 + vPhase);
  }

  // чистый градиент цвет-из → цвет-в: fog не подмешиваем, чтобы переход
  // между слоями читался (фидбек 5); таяние дальних делает alpha
  gl_FragColor = vec4(vColor * alpha, alpha);
}
`;

// ── геометрия: 3 ленты через тот же buildRibbonEdges-паттерн ──
const VERTS = [
  // [A xyz, B xyz, colorA, colorB, weight, kind]
  { a: [-350, 0, 200], b: [200, 0, -250], ca: [1.0, 0.76, 0.37], cb: [0.65, 0.55, 1.0], w: 1, k: 0 }, // янтарь → ирис
  { a: [-200, 60, -100], b: [320, -40, 120], ca: [0.3, 0.79, 1.0], cb: [0.53, 0.89, 0.63], w: 2, k: 1 }, // azure → mint, dashed
  { a: [100, -60, 260], b: [-120, 80, -60], ca: [1.0, 0.48, 0.54], cb: [1.0, 0.48, 0.54], w: 3, k: 2 }, // contradicts
];

function buildRibbon(count, vertexData) {
  const V = count * 4;
  const positions = new Float32Array(V * 3);
  const others = new Float32Array(V * 3);
  const colors = new Float32Array(V * 3);
  const weights = new Float32Array(V);
  const kinds = new Float32Array(V);
  const ends = new Float32Array(V);
  const sides = new Float32Array(V);
  const highlights = new Float32Array(V);
  const wc = (v, p, o, c, w, k, end, side, hl) => {
    const valid = (x) => Array.isArray(x) && x.length === 3 && x.every(Number.isFinite);
    if (!valid(p) || !valid(o) || !valid(c)) {
      say(`wc(v=${v}): bad source p=${JSON.stringify(p)} o=${JSON.stringify(o)} c=${JSON.stringify(c)}`, "bad");
      p = valid(p) ? p : [0, 0, 0]; o = valid(o) ? o : [0, 0, 0]; c = valid(c) ? c : [1, 1, 1];
    }
    positions.set(p, v * 3); others.set(o, v * 3); colors.set(c, v * 3);
    weights[v] = w; kinds[v] = k; ends[v] = end; sides[v] = side; highlights[v] = hl;
  };
  for (let e = 0; e < count; e++) {
    const d = vertexData(e);
    const b = e * 4;
    wc(b, d.a, d.b, d.colorA, d.weight, d.kind, 0, 1, d.highlight);
    wc(b + 1, d.a, d.b, d.colorA, d.weight, d.kind, 0, -1, d.highlight);
    wc(b + 2, d.b, d.a, d.colorB, d.weight, d.kind, 1, 1, d.highlight);
    wc(b + 3, d.b, d.a, d.colorB, d.weight, d.kind, 1, -1, d.highlight);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("aOther", new THREE.BufferAttribute(others, 3));
  geo.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
  geo.setAttribute("aWeight", new THREE.BufferAttribute(weights, 1));
  geo.setAttribute("aKind", new THREE.BufferAttribute(kinds, 1));
  geo.setAttribute("aEnd", new THREE.BufferAttribute(ends, 1));
  geo.setAttribute("aSide", new THREE.BufferAttribute(sides, 1));
  geo.setAttribute("aHighlight", new THREE.BufferAttribute(highlights, 1));
  const index = new Uint32Array(count * 6);
  for (let e = 0; e < count; e++) {
    const b = e * 4, o = e * 6;
    index[o] = b; index[o + 1] = b + 2; index[o + 2] = b + 1;
    index[o + 3] = b + 2; index[o + 4] = b + 3; index[o + 5] = b + 1;
  }
  geo.setIndex(new THREE.BufferAttribute(index, 1));
  return geo;
}

const geometry = buildRibbon(VERTS.length, (e) => {
  const d = VERTS[e];
  return {
    a: d.a, b: d.b,
    colorA: d.ca ?? [1, 1, 1],
    colorB: d.cb ?? [1, 1, 1],
    weight: d.w ?? 1,
    kind: d.k ?? 0,
    highlight: 0,
  };
});
const material = new THREE.ShaderMaterial({
  vertexShader: EDGE_VERTEX,
  fragmentShader: EDGE_FRAGMENT_SOLID,
  uniforms: {
    uTime: { value: 0 },
    uViewport: { value: new THREE.Vector2(innerWidth, innerHeight) },
    uEdgeWidth: { value: 6.0 },   // толсто: чтобы не промахнуться калибровкой
    uDebugSolid: { value: 0.0 },  // ШАГ 1: сплошной белый
  },
  transparent: true,
  depthWrite: false,
  depthTest: false,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
});

const mesh = new THREE.Mesh(geometry, material);
mesh.frustumCulled = false;
scene.add(mesh);

// контроль: те же отрезки обычными линиями (должны светиться всегда)
const lineGeo = new THREE.BufferGeometry();
const linePos = new Float32Array(VERTS.length * 6);
VERTS.forEach((v, e) => { linePos.set([...v.a], e * 6); linePos.set([...v.b], e * 6 + 3); });
lineGeo.setAttribute("position", new THREE.BufferAttribute(linePos, 3));
const lines3d = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, depthTest: false }));
scene.add(lines3d);

// точки-маркеры концов
const dotGeo = new THREE.BufferGeometry();
const dotPos = new Float32Array(VERTS.length * 2 * 3);
VERTS.forEach((v, e) => { dotPos.set([...v.a], e * 6); dotPos.set([...v.b], e * 6 + 3); });
dotGeo.setAttribute("position", new THREE.BufferAttribute(dotPos, 3));
scene.add(new THREE.Points(dotGeo, new THREE.PointsMaterial({ color: 0x5fe8c8, size: 10, sizeAttenuation: false, depthTest: false })));

// ── солнце + корона (текущий конвейер scene.ts) ──
const SUN_CAP = 1;
const sunGeo = new THREE.SphereGeometry(1, 20, 14);
const sunSeed = new THREE.InstancedBufferAttribute(new Float32Array(SUN_CAP), 1);
sunGeo.setAttribute("aInstSeed", sunSeed);
const sunMat = new THREE.ShaderMaterial({
  vertexShader: SUN_VERTEX,
  fragmentShader: SUN_FRAGMENT,
  uniforms: { uTime: { value: 0 } },
  transparent: true,
  depthWrite: true,
});
const sunMesh = new THREE.InstancedMesh(sunGeo, sunMat, SUN_CAP);
sunMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
sunMesh.count = 0;
sunMesh.frustumCulled = false;
scene.add(sunMesh);

const coronaGeo = new THREE.PlaneGeometry(2, 2);
coronaGeo.setAttribute("aInstSeed", sunSeed);
const coronaMat = new THREE.ShaderMaterial({
  vertexShader: CORONA_VERTEX,
  fragmentShader: CORONA_FRAGMENT,
  uniforms: { uTime: { value: 0 } },
  transparent: true,
  depthWrite: false,
  depthTest: false,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
});
const coronaMesh = new THREE.InstancedMesh(coronaGeo, coronaMat, SUN_CAP);
coronaMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
coronaMesh.count = 0;
coronaMesh.frustumCulled = false;
coronaMesh.renderOrder = 5;
scene.add(coronaMesh);

const sunColor = new THREE.Color(0xffffff); // тест различимости: белый шар
const m4 = new THREE.Matrix4();
let sunTime = 0;
function updateSun(dt) {
  sunTime += dt;
  const scale = 12.0; // юниты (дист ~190 → диск ~80px)
  m4.makeScale(scale, scale, scale);
  m4.setPosition(-30, 500, 800); // дист ~190 от камеры (0,620,950)
  sunMesh.setMatrixAt(0, m4);
  coronaMesh.setMatrixAt(0, m4);
  sunMesh.setColorAt(0, sunColor);
  coronaMesh.setColorAt(0, sunColor);
  sunSeed.setX(0, 0.42);
  sunMesh.count = 1;
  coronaMesh.count = 1;
  sunMesh.instanceMatrix.needsUpdate = true;
  coronaMesh.instanceMatrix.needsUpdate = true;
  if (sunMesh.instanceColor) sunMesh.instanceColor.needsUpdate = true;
  if (coronaMesh.instanceColor) coronaMesh.instanceColor.needsUpdate = true;
  sunMat.uniforms.uTime.value = sunTime;
  coronaMat.uniforms.uTime.value = sunTime;
}

const report = () => {
  const info = renderer.info.render;
  const bs = geometry.boundingSphere;
  lines.length = 2; // keep header
  say(`drawRange=${geometry.drawRange.count} tris=${info.triangles} calls=${info.calls}`);
  say(`edgeMesh visible=${mesh.visible} frustumCulled=${mesh.frustumCulled} bs=${bs ? bs.radius.toFixed(0) : "null"}`);
  say(`uViewport=(${material.uniforms.uViewport.value.x}x${material.uniforms.uViewport.value.y}) uEdgeWidth=${material.uniforms.uEdgeWidth.value}`);
  say(`vertex[0..5]=${[...geometry.getIndex().array.slice(0, 6)].join(",")}`);
  // sun-статы: count/цвет/матрица + программы
  const m = coronaMesh.matrixWorld.elements;
  say(`sun.count=${sunMesh.count} corona.count=${coronaMesh.count} hasColor=${!!sunMesh.instanceColor} matrixPos=(${m[12].toFixed(0)},${m[13].toFixed(0)},${m[14].toFixed(0)})`);
  say("sunColor: БЕЛЫЙ (тест различимости на тёмном)", "good");
  const programs = (renderer.info.programs || []).map((pr) =>
    pr.diagnostics ? "PROGRAM " + pr.name + ": " + JSON.stringify(pr.diagnostics).slice(0, 200) : "ok",
  );
  say("programs: " + (programs.length ? programs.join(" | ") : "none"), programs.some((t) => t !== "ok") ? "bad" : "");

  // CPU-расчёт clip/NDC/side всех 4 вершин квада №0 (пп. 1 и 3)
  camera.updateMatrixWorld();
  const vp = new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  const e = vp.elements;
  const oAttr = geometry.getAttribute("aOther");
  const p0 = geometry.getAttribute("position");
  const sAttr = geometry.getAttribute("aSide");
  const eAttr = geometry.getAttribute("aEnd");
  const idx = [...geometry.getIndex().array.slice(0, 6)];
  for (let c = 0; c < 4; c++) {
    const v = idx[c] ?? -1;
    const x = p0.getX(v), y = p0.getY(v), z = p0.getZ(v);
    const cw = e[3]*x + e[7]*y + e[11]*z + e[15];
    const cx = (e[0]*x + e[4]*y + e[8]*z + e[12]) / cw;
    const cy = (e[1]*x + e[5]*y + e[9]*z + e[13]) / cw;
    const bad = ![x, y, z, cw, cx, cy].every(Number.isFinite);
    say(
      `v${c}[i=${v}] clip=(${cx.toFixed(2)},${cy.toFixed(2)},w=${cw.toFixed(2)}) side=${sAttr ? sAttr.getX(v) : "?"} end=${eAttr ? eAttr.getX(v) : "?"} other=(${oAttr ? oAttr.getX(v).toFixed(0) : "?"},${oAttr ? oAttr.getY(v).toFixed(0) : "?"}) ${bad ? '<span class="bad">NaN/DEGENERATE</span>' : '<span class="good">ok</span>'}`,
      bad ? "bad" : "",
    );
  }
  if (info.triangles > 0) say("RIBBONS RENDERED (tris>0) — если белых полос на экране нет, они растеризуются вне вьюпорта/NaN", "good");
  panel.innerHTML = `<b>debug-ribbon</b>\n${lines.join("\n")}`;
  const shot = renderer.domElement.toDataURL("image/png");
  say(`<img src="${shot}" style="width:100%;border:1px solid #38bdf8">`, "");
};

report();
let frames = 0;
renderer.setAnimationLoop(() => {
  material.uniforms.uTime.value += 0.016;
  scene.rotation.y += 0.003;
  updateSun(0.016);
  renderer.render(scene, camera);
  frames++;
  if (frames === 10 || frames % 120 === 0) report();
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  material.uniforms.uViewport.value.set(innerWidth, innerHeight);
});
} catch (e) { // ==== конец try ====
  panel.innerHTML = '<span class="bad">ERROR: ' + ((e && e.stack) || e) + '</span>';
}

</script>
</body>
</html>

name: Auto-deploy selti on main

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sync code to server
        run: |
          rsync -av --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude .venv \
            --exclude web/dist \
            $GITHUB_WORKSPACE/ \
            $HOME/app/src/selti/

      # Бэкап БД перед любым деплоем: миграции применяются при старте
      # контейнера, пути назад без дампа нет (DOWN-миграций нет).
      # Ретеншн: последние 10 бэкапов, старше 14 дней — удаляются.
      - name: Backup database (pre-deploy)
        run: |
          mkdir -p ~/backups
          BACKUP=~/backups/memory_$(date +%Y%m%d_%H%M%S)_pre-deploy.sql
          docker exec postgres pg_dump -U svc_athene_ai -d memory > "$BACKUP"
          test -s "$BACKUP" || { echo "pg_dump returned empty file, aborting deploy"; exit 1; }
          echo "backup OK: $BACKUP ($(du -h "$BACKUP" | cut -f1))"
          ls -1t ~/backups/memory_*_pre-deploy.sql 2>/dev/null | tail -n +11 | xargs -r rm -f
          find ~/backups -name "memory_*_pre-deploy.sql" -mtime +14 -delete

      - name: Build and deploy
        run: |
          cd ~/app
          # Откаточный тег: текущий latest -> previous ДО пересборки.
          # :previous живёт 72h (см. Cleanup ниже).
          for img in app-selti app-celery-worker; do
            if [ -n "$(docker images -q ${img}:latest 2>/dev/null)" ]; then
              docker tag ${img}:latest ${img}:previous
              echo "rollback tag: ${img}:previous"
            fi
          done
          docker compose build selti celery-worker
          docker compose up -d selti celery-worker celery-beat
          sleep 5
          docker compose ps selti celery-worker celery-beat

      # Вебморда: nginx раздаёт статику из /etc/nginx/landing/ui/ на хосте —
      # docker-образы её не содержат, собираем и доставляем отдельно.
      # Сборка в контейнере (node:20-alpine), чтобы runner не зависел от
      # локального node; --user не нужен, chown в конце под ssh-пользователя.
      - name: Build web UI
        run: |
          # --user: dist принадлежит runner'у, не root — иначе следующий
          # rsync --delete не сможет его удалить (инцидент 20.09).
          # bookworm (glibc), не alpine: npm на musl стабильно флейкает
          # «Exit handler never called» (инциденты 20-21.09); ретрай оставлен.
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$HOME/app/src/selti/web":/app -w /app \
            node:20-bookworm-slim sh -c '
              (npm ci --no-audit --no-fund --cache /tmp/.npm-cache ||
                { rm -rf node_modules /tmp/.npm-cache; npm ci --no-audit --no-fund --cache /tmp/.npm-cache; }
              ) && npm run build'
          test -f ~/app/src/selti/web/dist/index.html || { echo "web build failed: no dist/index.html"; exit 1; }

      - name: Deploy web UI
        run: |
          mkdir -p /etc/nginx/landing/ui
          rsync -av --delete ~/app/src/selti/web/dist/ /etc/nginx/landing/ui/
          ls -la /etc/nginx/landing/ui/ | head -5

      # Сквозной smoke (инцидент 22.09: деплой был «зелёным» при полностью
      # мёртвом фронте — старая проверка била localhost:8000 МИМО nginx,
      # а тот отдавал 502 на все /api/* из-за устаревшего upstream IP).
      # Теперь проверяем: бэкенд жив + плечо nginx→selti + морда отдаётся.
      # /ui/ и /api/ проверяем как LAN-клиент (source = LAN-IP сервера):
      # allow-list 10.0.0.0/24 режет loopback-петли через DNAT (172.18.0.1).
      - name: Verify health (backend + через nginx + web UI)
        run: |
          curl -sf http://localhost:8000/live >/dev/null \
            && echo "selti /live OK" || { echo "selti /live FAILED"; exit 1; }
          curl -skf --resolve memory.atom.ui:443:127.0.0.1 https://memory.atom.ui/live >/dev/null \
            && echo "nginx->selti OK" || { echo "nginx->selti FAILED (502 = upstream, см. infra/nginx/conf.d/README.md)"; exit 1; }
          LAN_IP=$(hostname -I | awk '{print $1}')
          curl -skf --interface "$LAN_IP" --resolve ai.atom.ui:443:"$LAN_IP" https://ai.atom.ui/ui/ >/dev/null \
            && echo "web UI OK (from $LAN_IP)" || { echo "web UI FAILED"; exit 1; }
          curl -skf --interface "$LAN_IP" --resolve ai.atom.ui:443:"$LAN_IP" https://ai.atom.ui/api/namespaces >/dev/null \
            && echo "web UI API OK (nginx auth-inject + selti)" || { echo "web UI API FAILED"; exit 1; }

      # 72h, не 24h: откаточный образ :previous должен пережить
      # окно отката (3 дня). Prune -af всё равно заберёт dangling-слои.
      - name: Cleanup old images
        run: docker image prune -af --filter "until=72h"
        continue-on-error: true

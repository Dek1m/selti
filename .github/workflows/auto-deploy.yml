name: Auto-deploy selti on main

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sync code to server
        run: |
          rsync -av --delete \
            $GITHUB_WORKSPACE/ \
            /home/svc_athene_ai/opencode/projects/selti/

      - name: Build and deploy
        run: |
          cd ~/app
          docker compose build selti celery-worker
          docker compose up -d selti celery-worker
          sleep 5
          docker compose ps selti celery-worker

      - name: Verify health
        run: curl -sf http://localhost:8000/health && echo " OK" || echo " FAILED"

      - name: Cleanup old images
        run: docker image prune -af --filter "until=24h"
        continue-on-error: true

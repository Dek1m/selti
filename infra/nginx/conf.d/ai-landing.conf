# ai.atom.ui — Argenta Team landing + Phase 5 memory access (replaces opencode+oauth2, 2026-09-19)
# 2026-09-22 (Рэй): proxy на selti переведён на runtime-резолв Docker DNS —
# статический upstream кэшировал IP контейнера при старте nginx и ломался
# при деплоях (502 на /api/*). См. memory.conf для деталей.

server {
    listen 80 default_server;
    server_name ai.atom.ui;

    # Самопроверка nginx (плечо 1 docker-healthcheck), до редиректа на https
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name ai.atom.ui;

    ssl_certificate /etc/nginx/fullchain.pem;
    ssl_certificate_key /etc/nginx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Docker embedded DNS: IP контейнеров меняется при каждом деплое —
    # резолвим в рантайме, а не при старте nginx
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Static Argenta Team landing
    root /var/www/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Memory search UI (Phase 5.2) — LAN only, no login (nginx trusts the home network)
    location = /ui {
        return 301 /ui/;
    }
    location /ui/ {
        allow 10.0.0.0/24;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        alias /var/www/landing/ui/;
        try_files $uri $uri/ /ui/index.html;
    }

    # Memory access (Phase 5): selti API Swagger UI.
    # LAN clients get the key injected (see zz-selti-api-auth.conf);
    # external clients must pass their own Bearer via Authorize.
    location = /memory {
        return 301 /memory/;
    }
    location = /memory/ {
        set $selti_docs "http://selti:8000/docs";
        proxy_pass $selti_docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /openapi.json {
        set $selti_openapi "http://selti:8000/openapi.json";
        proxy_pass $selti_openapi;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        set $selti_upstream "http://selti:8000";
        proxy_pass $selti_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $selti_api_auth;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

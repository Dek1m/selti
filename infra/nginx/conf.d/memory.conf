# memory.atom.ui — selti API/MCP фронтенд.
# 2026-09-22 (Рэй, инцидент P1 «вебморда не коннектится к selti»):
#   статический `upstream selti { server selti:8000; }` резолвился ОДИН раз
#   при старте nginx; деплои пересоздают контейнер selti → IP меняется →
#   nginx продолжал стучать на старый IP (502; на старом IP сидел selti-beat).
#   Фикс: runtime-резолв имени через Docker DNS (127.0.0.11) + переменная
#   в proxy_pass — nginx перезапрашивает IP каждые 10s сам, без reload.

server {
    listen 80;
    server_name memory.atom.ui;

    # Самопроверка nginx (плечо 1 docker-healthcheck), до редиректа на https
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name memory.atom.ui;

    ssl_certificate /etc/nginx/fullchain.pem;
    ssl_certificate_key /etc/nginx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Docker embedded DNS: IP контейнеров меняется при каждом деплое —
    # резолвим в рантайме, а не при старте nginx
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Переменная => DNS-резолв в рантайме (см. комментарий сверху)
    set $selti_upstream "http://selti:8000";

    location / {
        proxy_pass $selti_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ============================================================
# prometheus-rules.yml — Алерты для PostgreSQL + Redis + Celery
# ============================================================
groups:
  - name: postgres
    interval: 30s
    rules:
      # ----- Доступность -----
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL недоступен"
          description: "PG instance {{ $labels.instance }} не отвечает"

      - alert: PostgreSQLHighConnectionsUsage
        expr: |
          pg_stat_database_numbackends > 0.8 * 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокая загрузка соединений"
          description: "Использовано {{ $value }} из 50 соединений"

      # ----- Производительность -----
      - alert: PostgreSQLQueryConflict
        expr: |
          rate(pg_stat_database_conflicts_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Конфликты запросов (standby)"
          description: "Обнаружены конфликты запросов на реплике"

      - alert: PostgreSQLLongRunningQuery
        expr: |
          time() - max(pg_stat_activity_query_start{state='active'}) by (datname) > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Долгий запрос > 5 минут"
          description: "Запрос выполняется {{ $value }} секунд"

      # ----- WAL / Бэкапы -----
      - alert: PostgreSQLWalBackupLag
        expr: |
          (pg_stat_archiver_last_archive_age_seconds > 3600)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "WAL-архивация отстаёт"
          description: "Последняя архивация WAL была > 1 часа назад"

      - alert: PostgreSQLNoBackup
        expr: |
          time() - pg_last_backup_timestamp > 86400 * 2
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Нет полного бэкапа > 2 дней"
          description: "Последний полный бэкап: {{ $value | humanizeTimestamp }}"


  - name: redis
    interval: 30s
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis недоступен"

      - alert: RedisMemoryHigh
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis использует > 85% памяти"
          description: "Занято {{ $value | humanizePercentage }} памяти"

      - alert: RedisCacheMissRateHigh
        expr: |
          rate(redis_keyspace_misses_total[5m])
          /
          (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))
          > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cache miss rate > 30%"

      - alert: RedisSlowOperations
        expr: |
          histogram_quantile(0.95, rate(selti_redis_ops_duration_seconds_bucket[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis операции медленные (P95 > 100ms)"
          description: "Операция {{ $labels.operation }}, P95 = {{ $value }}s"

  # ============================================================
  # Celery tasks (по плану v3, Фаза 4)
  # ============================================================
  - name: celery
    interval: 30s
    rules:
      # 1. Доступность воркеров
      - alert: CeleryWorkersDown
        expr: selti_celery_workers_active == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Нет активных Celery workers"
          description: "Все воркеры недоступны > 2 минут"

      # 2. Высокий процент ошибок
      - alert: CeleryHighErrorRate
        expr: |
          rate(selti_celery_tasks_total{status="failure"}[5m])
          /
          (rate(selti_celery_tasks_total[5m]) > 0)
          > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery error rate > 10%"
          description: "Задача {{ $labels.task }}, {{ $value | humanizePercentage }} ошибок"

      # 3. Медленные задачи (P95 duration > 30s)
      - alert: CelerySlowTasks
        expr: |
          histogram_quantile(0.95, rate(selti_celery_task_duration_seconds_bucket[5m])) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery задачи медленные (P95 > 30s)"
          description: "Задача {{ $labels.task }}, P95 = {{ $value }}s"

      # 4. Высокая задержка в очереди (P95 latency > 5s)
      - alert: CeleryHighQueueLatency
        expr: |
          histogram_quantile(0.95, rate(selti_celery_task_latency_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue latency P95 > 5s"
          description: "Задача {{ $labels.task }} ждёт в очереди {{ $value }}s"

      # 5. Много retry (> 5 в минуту)
      - alert: CeleryHighRetryRate
        expr: rate(selti_celery_task_retries_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery retry rate > 5/min"
          description: "Задача {{ $labels.task }}, retry/sec = {{ $value }}"

      # 6. Есть таймауты (любые)
      - alert: CeleryTaskTimeouts
        expr: increase(selti_celery_task_timeouts_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Celery task timeout"
          description: "Задача {{ $labels.task }} таймаутнулась"

      # 7. Очередь забита (> 100 pending)
      - alert: CeleryQueueBacklog
        expr: selti_celery_queue_length > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery очередь > 100 задач"
          description: "Очередь {{ $labels.queue }}, {{ $value }} pending"

  # ============================================================
  # Selti application metrics
  # ============================================================
  - name: selti
    interval: 30s
    rules:
      - alert: SeltiHighToolErrorRate
        expr: |
          rate(selti_mcp_tool_calls_total{status="error"}[5m])
          /
          (rate(selti_mcp_tool_calls_total[5m]) > 0)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MCP tool error rate > 5%"
          description: "Tool {{ $labels.tool }}, {{ $value | humanizePercentage }} ошибок"

      - alert: SeltiSlowToolCalls
        expr: |
          histogram_quantile(0.95, rate(selti_mcp_tool_duration_seconds_bucket[5m])) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MCP tool P95 > 10s"
          description: "Tool {{ $labels.tool }}, P95 = {{ $value }}s"

      - alert: SeltiQdrantSlowSearch
        expr: |
          histogram_quantile(0.95, rate(selti_qdrant_ops_duration_seconds_bucket{operation="search"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Qdrant search P95 > 1s"
          description: "Qdrant search P95 = {{ $value }}s"

# Самосборный пакет: selti (MCP memory-сервер + celery worker/beat/flower).
# Build-context — корень этого пакета (src/selti = git-клон argenta/selti).
# Головной ~/app/docker-compose.yml импортирует этот фрагмент через include.
services:
  celery-worker:
    image: app-celery-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: |
      celery -A memory_server.celery_app worker -Q memory,batch,hash -c 4 --without-gossip --without-mingle --without-heartbeat --max-tasks-per-child=1000 --max-memory-per-child=200000 -l INFO --logfile=-
    container_name: selti-worker
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      selti:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://svc_athene_ai:${SELTI_DB_PASSWORD}@postgres:5432/memory
      EMBEDDING_API_URL: http://10.0.0.21:8080/v1
      EMBEDDING_DIMENSION: '4096'
      EMBEDDING_MODEL: qwen3-embedding-8b
      LOG_FORMAT: posix
      LOG_LEVEL: INFO
      QDRANT_COLLECTION: memories
      QDRANT_ENABLED: 'true'
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: selti-worker
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD
      - celery
      - -A
      - memory_server.celery_app
      - inspect
      - ping
      - --timeout=10
      timeout: 15s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    restart: unless-stopped
  celery-beat:
    image: app-celery-worker:latest
    command: |
      celery -A memory_server.celery_app beat -l INFO --schedule=/data/celerybeat-schedule
    container_name: selti-beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://svc_athene_ai:${SELTI_DB_PASSWORD}@postgres:5432/memory
      EMBEDDING_API_URL: http://10.0.0.21:8080/v1
      EMBEDDING_DIMENSION: '4096'
      EMBEDDING_MODEL: qwen3-embedding-8b
      LOG_FORMAT: posix
      LOG_LEVEL: INFO
      QDRANT_COLLECTION: memories
      QDRANT_ENABLED: 'true'
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: selti-beat
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD-SHELL
      - test $(( $(date +%s) - $(stat -c %Y /data/beat-heartbeat) )) -lt 300
      timeout: 10s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    restart: unless-stopped
    volumes:
    - beat_schedule:/data
  flower:
    command: celery -A memory_server.celery_app flower --port=5555
    container_name: athena-flower
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    ports:
    - 5555:5555
    profiles:
    - dev
  selti:
    container_name: selti
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://svc_athene_ai:${SELTI_DB_PASSWORD}@postgres:5432/memory
      EMBEDDING_API_URL: http://10.0.0.21:8080/v1
      EMBEDDING_DIMENSION: '4096'
      EMBEDDING_MODEL: qwen3-embedding-8b
      JEV_BASE_URL: http://host.docker.internal:8100
      JEV_ACCESS_KEY: ${JEV_ACCESS_KEY}
      LOG_FORMAT: posix
      LOG_LEVEL: INFO
      QDRANT_COLLECTION: memories
      QDRANT_ENABLED: 'true'
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      SELTI_API_KEY: ${SELTI_API_KEY}
      API_KEY: ${SELTI_API_KEY}
      SERVICE_NAME: selti
    extra_hosts:
    - "host.docker.internal:host-gateway"
    ports:
    - '8000:8000'
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:8000/live
      timeout: 10s
    image: selti:latest
    build:
      context: .
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    restart: unless-stopped

volumes:
  beat_schedule:
    driver: local
